spring:
  application:
    name: talentflow
  datasource:
    # Defaults match the local docker compose stack; override via environment in any other setup.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentflow}
    username: ${DB_USERNAME:talentflow}
    password: ${DB_PASSWORD:talentflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is what browsers see; keys may be fetched from an internal address.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/talentflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/talentflow/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:talentflow-api}
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

talentflow:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
