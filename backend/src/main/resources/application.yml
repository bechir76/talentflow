spring:
  application:
    name: talentflow
  datasource:
    # Defaults match the local docker compose stack; override via environment in any other setup.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/talentflow}
    username: ${DB_USERNAME:talentflow}
    password: ${DB_PASSWORD:talentflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is what browsers see; keys may be fetched from an internal address.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/talentflow}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/talentflow/protocol/openid-connect/certs}
          audiences: ${KEYCLOAK_AUDIENCE:talentflow-api}
  mail:
    # Mailpit in local development; set MAIL_HOST/MAIL_PORT (and credentials) for a real SMTP server.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

talentflow:
  mail:
    from: ${MAIL_FROM:TalentFlow <no-reply@talentflow.dev>}
  storage:
    cv-directory: ${CV_STORAGE_DIR:./data/cvs}
  privacy:
    # Stored with every consent; bump it whenever the privacy policy text changes.
    policy-version: ${PRIVACY_POLICY_VERSION:2026-10}
  ai:
    # Leave LLM_API_KEY empty to use the offline keyword analyzer. Any OpenAI-compatible API works;
    # the default is Mistral (EU-hosted).
    base-url: ${LLM_BASE_URL:https://api.mistral.ai/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:mistral-small-latest}
    timeout: ${LLM_TIMEOUT:60s}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
