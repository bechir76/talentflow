name: talentflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentflow}
      POSTGRES_USER: ${POSTGRES_USER:-talentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      # Tokens always carry the browser-facing issuer, even when fetched from inside the network.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Substituted into the realm import (service account secret of the backend).
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      # Substituted into the web app client's redirect and logout URLs.
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-talentflow}
      DB_USERNAME: ${POSTGRES_USER:-talentflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: http://localhost:${KEYCLOAK_PORT:-8180}/realms/talentflow
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/talentflow/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      CV_STORAGE_DIR: /var/lib/talentflow/cvs
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.mistral.ai/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-mistral-small-latest}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - cv-data:/var/lib/talentflow/cvs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8180}
        VITE_COMPANY_NAME: ${COMPANY_NAME:-Acme GmbH}
    environment:
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT:-8180}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres-data:
  cv-data:
